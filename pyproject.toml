[project]
name = "lingro-rag-service"
version = "1.10.0"
description = "Multi-strategy RAG question answering service built on FastAPI, LangChain and LangGraph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "unstructured[all-docs]",
    "unstructured[local-inference]",
    "paddlepaddle>=3.0.0rc1",
    "unstructured.paddleocr>=2.8.1.0",
    "langchain==1.2.10",
    "langchain-core==1.2.14",
    "langchain-community==1.0.0a1",
    "langchain-text-splitters==1.1.1",
    "langchain-mcp-adapters==0.2.1",
    "mcp==1.23.3",
    "langgraph==1.0.9",
    "langgraph-prebuilt==1.0.8",
    "langchainhub",
    "langchain-openai>=1.1.7",
    "langchain-google-genai>=2.1.7",
    "langchain-anthropic>=1.3.1",
    "langchain-deepseek>=1.0.1",
    "nest_asyncio>=1.6.0",
    "transformers>=4.56.1",
    "sentence-transformers>=3.3.0",
    "tokenizers>=0.13.3",
    "sentencepiece==0.1.99",
    "layoutparser[layoutmodels,tesseract]",
    "faiss-gpu-cu12==1.12.0",
    "PyMySQL",
    "docx2txt",
    "rank_bm25",
    "jq",
    "sseclient-py",
    "tiktoken",
    "fastapi>=0.115.5",
    "uvicorn>=0.32.1",
    "redis",
    "rq",
    "pydantic>=2.9.2",
    "chardet==5.2.0",
    "python-docx>=1.1.2",
    "openai",
    "jsonpickle>=3.2.2",
    "protobuf",
    "httpx",
    "httpx-sse",
    "PyJWT",
    "dashscope",
    "multiprocess>=0.70.16",
    "igraph",
    "neo4j",
    "accelerate",
    "jieba",
    "jinja2",
    "exceptiongroup",
    "lingua-language-detector",
    # 以下存在依赖冲突，如果有新版本可以解决请升级
    "langchain_unstructured>=0.1.6",
    "langchain-elasticsearch==0.4.0",
    "langchain-qwq>=0.3.4",
    "refchecker>=0.2.14",
    "json-repair>=0.40.0",
    "python-dotenv>=1.2.1",
]

[tool.uv]
# 这是一个应用而不是可发布的库：uv sync 只解析依赖，不构建本包
package = false
index-url = "https://mirrors.aliyun.com/pypi/simple"
# 解决依赖冲突
override-dependencies = [
    "numpy==1.26.4",
    "scipy==1.15.3",
    "six>=1.16.0",
    "refchecker>=0.2.14",
    "langchain-core>=0.3.0,<2.0.0",
    "anthropic>=0.69.0,<1.0.0",
    "openai>=2.7.2",
]
